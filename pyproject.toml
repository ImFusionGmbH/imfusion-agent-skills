[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imfusion-sdk-agent-kit"
version = "0.1.0"
description = "Install ImFusion SDK rules and skills for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
	{ name = "ImFusion GmbH" },
]
keywords = ["imfusion", "cursor", "claude-code", "opencode", "agent-skills"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/ImFusionGmbH/imfusion-sdk-agent-kit"
Repository = "https://github.com/ImFusionGmbH/imfusion-sdk-agent-kit"
Issues = "https://github.com/ImFusionGmbH/imfusion-sdk-agent-kit/issues"

[project.scripts]
imfusion-sdk-agent-kit = "imfusion_sdk_agent_kit.cli:main"

[project.optional-dependencies]
dev = [
	"build",
	"pytest>=8",
	"twine",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imfusion_sdk_agent_kit = ["assets/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
