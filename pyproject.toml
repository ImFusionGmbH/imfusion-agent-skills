[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imfusion-agent-skills"
version = "0.2.1"
description = "Install ImFusion SDK rules and skills for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
	{ name = "ImFusion GmbH" },
]
keywords = ["imfusion", "cursor", "claude-code", "opencode", "agent-skills"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Environment :: Console",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/ImFusionGmbH/imfusion-agent-skills"
Repository = "https://github.com/ImFusionGmbH/imfusion-agent-skills"
Issues = "https://github.com/ImFusionGmbH/imfusion-agent-skills/issues"

[project.scripts]
imfusion-agent-skills = "imfusion_agent_skills.cli:main"

[project.optional-dependencies]
dev = [
	"build",
	"pytest>=8",
	"ruff>=0.16,<0.17",
	"twine",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
imfusion_agent_skills = ["assets/**/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]
